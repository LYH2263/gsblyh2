name: weibo-system

services:
  mysql:
    image: mysql:8.0
    container_name: weibo_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: web
      MYSQL_USER: web
      MYSQL_PASSWORD: 123456
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weibo_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      FLASK_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: web
      DB_USER: web
      DB_PASSWORD: 123456
      SECRET_KEY: weibo-secret-key-2024
    volumes:
      - ./backend/app/static/uploads:/app/static/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weibo_frontend
    restart: always
    ports:
      - "3002:80"
    depends_on:
      - backend

volumes:
  mysql_data:
